<!DOCTYPE html>
<html>
<head>
  <title>Assignment #1 - JavaScript</title>
</head>
<body>
  <script>
    // รับ input จากผู้ใช้
    let input = prompt("Input integer number");

    // แปลง input เป็นตัวเลข
    let number = Number(input);

    // ตรวจสอบว่าเป็น integer หรือไม่
    if (Number.isInteger(number)) {
        if (number === 0) {
            alert("zero integer number");
        } else if (number % 2 === 0) {
            alert("even integer number");
        } else {
            alert("odd integer number");
        }
    } else {
        alert("Please enter an integer number only!");
    }
  </script>
</body>
 
</html>
